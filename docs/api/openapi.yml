openapi: 3.0.3
info:
  title: PONGO DIO API
  version: 0.1.0
  description: |
    API contract for the Sign In screen (/signin).
    On success, the client stores the returned token and redirects to /app.
servers:
 - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Authentication endpoints

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in (login)
      description: Authenticate with username or email + password. Returns a bearer token on success.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              usernameLogin:
                summary: Login with username
                value:
                  identifier: "player1"
                  password: "secret-password"
              emailLogin:
                summary: Login with email
                value:
                  identifier: "player1@email.com"
                  password: "secret-password"
      responses:
        "200":
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                success:
                  value:
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    user:
                      id: "u_123"
                      username: "player1"
                      email: "player1@email.com"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  value:
                    error:
                      code: "INVALID_CREDENTIALS"
                      message: "Invalid credentials"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  value:
                    error:
                      code: "INTERNA"
  /auth/signup:
    post:
      tags: [Auth]
      summary: Sign up (create account)
      description: |
        Creates a new user account.

        UX options after success:
        - **Option A (recommended):** auto-login (return token) and client redirects to `/app`.
        - **Option B:** no token, client redirects to `/signin` with "Account created".

        This spec supports both by returning either `token+user` (autoLogin=true)
        or just `user` (autoLogin=false).
      operationId: authSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
            examples:
              createAccount:
                value:
                  username: "player1"
                  email: "player1@email.com"
                  password: "secret-password"
                  confirmPassword: "secret-password"
                  acceptTerms: true
                  autoLogin: true
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SignupResponseAutoLogin"
                  - $ref: "#/components/schemas/SignupResponseNoAutoLogin"
              examples:
                autoLogin:
                  summary: Option A - auto-login
                  value:
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    user:
                      id: "u_123"
                      username: "player1"
                      email: "player1@email.com"
                noAutoLogin:
                  summary: Option B - redirect to /signin
                  value:
                    user:
                      id: "u_123"
                      username: "player1"
                      email: "player1@email.com"
        "400":
          description: Invalid input / validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidEmail:
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Invalid input"
                      details:
                        - field: "email"
                          message: "Email must be a valid email address"
                passwordMismatch:
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Invalid input"
                      details:
                        - field: "confirmPassword"
                          message: "Passwords do not match"
        "409":
          description: Username or email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                usernameTaken:
                  value:
                    error:
                      code: "USERNAME_TAKEN"
                      message: "Username already taken"
                      field: "username"
                emailTaken:
                  value:
                    error:
                      code: "EMAIL_TAKEN"
                      message: "Email already in use"
                      field: "email"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  value:
                    error:
                      code: "INTERNAL_SERVER_ERROR"
                      message: "Unexpected error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Invalidates the current session/token (if applicable).
      operationId: authLogout
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Logged out successfully (no content)
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notAuthenticated:
                  value:
                    error:
                      code: "NOT_AUTHENTICATED"
                      message: "Authentication required"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms:
    get:
      tags: [Rooms]
      summary: List rooms
      description: |
        Returns rooms filtered by status. Used by /app "Remote" button and the Remote Rooms modal (Join tab).
      operationId: listRooms
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          required: false
          description: Filter by room status.
          schema:
            type: string
            enum: [open, full, starting, closed]
          example: open
      responses:
        "200":
          description: List of rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomListResponse"
              examples:
                openRooms:
                  value:
                    rooms:
                      - id: "r_001"
                        name: "Room Alpha"
                        status: "open"
                        capacity: 2
                        playersCount: 1
                        host:
                          id: "u_123"
                          username: "alice"
                        createdAt: "2026-01-12T10:00:00Z"
                      - id: "r_002"
                        name: "Fast Match"
                        status: "open"
                        capacity: 2
                        playersCount: 1
                        host:
                          id: "u_456"
                          username: "bob"
                        createdAt: "2026-01-12T10:02:00Z"
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Rooms]
      summary: Create a remote room
      description: |
        Creates a new remote room. Used by /app Remote Rooms modal (Create tab).
      operationId: createRoom
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
            examples:
              createRoom:
                value:
                  name: "My room"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRoomResponse"
              examples:
                created:
                  value:
                    room:
                      id: "r_003"
                      name: "My room"
                      status: "open"
                      capacity: 2
                      playersCount: 1
                      host:
                        id: "u_123"
                        username: "alice"
                      createdAt: "2026-01-12T10:05:00Z"
        "400":
          description: Invalid input / validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidName:
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Invalid input"
                      details:
                        - field: "name"
                          message: "Name must be between 1 and 40 characters"
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms/{roomId}/join:
    post:
      tags: [Rooms]
      summary: Join a room
      description: Joins an open room. Used by /app Remote Rooms modal (Join CTA).
      operationId: joinRoom
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
          example: "r_001"
      responses:
        "200":
          description: Joined successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRoomResponse"
              examples:
                joined:
                  value:
                    roomId: "r_001"
                    lobbyUrl: "/rooms/r_001"
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found / no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                roomNotFound:
                  value:
                    error:
                      code: "ROOM_NOT_FOUND"
                      message: "Room no longer available"
        "409":
          description: Conflict (room full / already joined / room closed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                roomFull:
                  value:
                    error:
                      code: "ROOM_FULL"
                      message: "Room is full"
                roomClosed:
                  value:
                    error:
                      code: "ROOM_CLOSED"
                      message: "Room is closed"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ws:
    get:
      tags: [Realtime]
      summary: WebSocket endpoint (rooms updates)
      description: |
        WebSocket endpoint for realtime updates.
        The client can subscribe to rooms updates for the /app "Remote" attention mode.

        Events (server -> client):
        - rooms:update { openCount: number, rooms: Room[] }
      operationId: websocketEndpoint
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)
  /rooms/{roomId}:
    get:
      tags: [Rooms]
      summary: Get room state (lobby)
      description: |
        Returns the current room state for the Remote Room Lobby screen.
        Includes players + ready flags + status used to render:
        - Waiting for opponent
        - Opponent joined
        - Starting (countdown)
      operationId: getRoom
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
          example: "r_001"
      responses:
        "200":
          description: Room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStateResponse"
              examples:
                hostAlone:
                  value:
                    room:
                      id: "r_001"
                      name: "Room Alpha"
                      status: "open"
                      capacity: 2
                      playersCount: 1
                      host:
                        id: "u_123"
                        username: "alice"
                        avatarUrl: null
                      guest: null
                      hostReady: false
                      guestReady: false
                      code: "A1B2C3"
                      createdAt: "2026-01-12T10:00:00Z"
                fullNotReady:
                  value:
                    room:
                      id: "r_001"
                      name: "Room Alpha"
                      status: "full"
                      capacity: 2
                      playersCount: 2
                      host:
                        id: "u_123"
                        username: "alice"
                        avatarUrl: null
                      guest:
                        id: "u_456"
                        username: "bob"
                        avatarUrl: null
                      hostReady: true
                      guestReady: false
                      code: "A1B2C3"
                      createdAt: "2026-01-12T10:00:00Z"
                startingCountdown:
                  value:
                    room:
                      id: "r_001"
                      name: "Room Alpha"
                      status: "starting"
                      capacity: 2
                      playersCount: 2
                      host:
                        id: "u_123"
                        username: "alice"
                        avatarUrl: null
                      guest:
                        id: "u_456"
                        username: "bob"
                        avatarUrl: null
                      hostReady: true
                      guestReady: true
                      countdown:
                        from: 3
                        startedAt: "2026-01-12T10:10:00Z"
                      gameId: "g_789"
                      code: "A1B2C3"
                      createdAt: "2026-01-12T10:00:00Z"
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not allowed (not a member of this room)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notMember:
                  value:
                    error:
                      code: "FORBIDDEN"
                      message: "You are not a member of this room"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                roomNotFound:
                  value:
                    error:
                      code: "ROOM_NOT_FOUND"
                      message: "Room not found"
        "410":
          description: Room closed/canceled (gone)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                roomGone:
                  value:
                    error:
                      code: "ROOM_CLOSED"
                      message: "Room was canceled"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms/{roomId}/ready:
    post:
      tags: [Rooms]
      summary: Toggle ready/unready
      description: |
        Sets the caller ready flag in the room lobby.
        When both players are ready, server transitions room status to `starting`
        and returns (or later emits) the countdown + gameId.
      operationId: setRoomReady
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
          example: "r_001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadyRequest"
            examples:
              ready:
                value: { ready: true }
              unready:
                value: { ready: false }
      responses:
        "200":
          description: Updated room state (after applying ready flag)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStateResponse"
              examples:
                nowStarting:
                  value:
                    room:
                      id: "r_001"
                      name: "Room Alpha"
                      status: "starting"
                      capacity: 2
                      playersCount: 2
                      host:
                        id: "u_123"
                        username: "alice"
                        avatarUrl: null
                      guest:
                        id: "u_456"
                        username: "bob"
                        avatarUrl: null
                      hostReady: true
                      guestReady: true
                      countdown:
                        from: 3
                        startedAt: "2026-01-12T10:10:00Z"
                      gameId: "g_789"
                      code: "A1B2C3"
                      createdAt: "2026-01-12T10:00:00Z"
        "400":
          description: Invalid input / validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidBody:
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Invalid input"
                      details:
                        - field: "ready"
                          message: "ready must be a boolean"
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not allowed (not a member of this room)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (room not in a state that accepts ready)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyStarting:
                  value:
                    error:
                      code: "ROOM_STARTING"
                      message: "Room is starting; ready state locked"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms/{roomId}/leave:
    post:
      tags: [Rooms]
      summary: Leave room (guest)
      description: |
        Leaves the room as a participant.
        Typical usage: guest presses "Leave room".
      operationId: leaveRoom
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
          example: "r_001"
      responses:
        "204":
          description: Left the room successfully (no content)
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not allowed (not a member of this room)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (cannot leave during countdown / already started)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                cannotLeave:
                  value:
                    error:
                      code: "ROOM_STARTING"
                      message: "Cannot leave while match is starting"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms/{roomId}/cancel:
    post:
      tags: [Rooms]
      summary: Cancel room (host)
      description: |
        Cancels (closes) the room. Typical usage: host presses "Cancel room".
        This kicks the guest (if present) and marks the room closed.
      operationId: cancelRoom
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
          example: "r_001"
      responses:
        "204":
          description: Room canceled successfully (no content)
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (only host can cancel)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                onlyHost:
                  value:
                    error:
                      code: "FORBIDDEN"
                      message: "Only the host can cancel the room"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (cannot cancel after game started)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyStarted:
                  value:
                    error:
                      code: "ROOM_ALREADY_STARTED"
                      message: "Cannot cancel after the match has started"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me:
    get:
      tags: [Users]
      summary: Get current user profile
      description: |
        Returns the authenticated user's profile data used by /profile (view mode)
        and to prefill the edit form.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
              examples:
                me:
                  value:
                    user:
                      id: "u_123"
                      nickname: "alice"
                      bio: "Pong lover"
                      avatarUrl: "https://cdn.example.com/avatars/u_123.webp"
                      winPhrase: "GG EZ"
                      stats:
                        played: 42
                        wins: 25
                        losses: 17
                        winrate: 59.52
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags: [Users]
      summary: Update current user profile (non-password fields)
      description: |
        Updates editable profile fields (nickname, bio, winPhrase, avatarUrl).
        Used by /profile when user clicks "Accept changes".
      operationId: updateMe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
            examples:
              updateProfile:
                value:
                  nickname: "alice2"
                  bio: "New bio"
                  winPhrase: "You never stood a chance"
                  avatarUrl: "https://cdn.example.com/avatars/u_123.webp"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
              examples:
                updated:
                  value:
                    user:
                      id: "u_123"
                      nickname: "alice2"
                      bio: "New bio"
                      avatarUrl: "https://cdn.example.com/avatars/u_123.webp"
                      winPhrase: "You never stood a chance"
                      stats:
                        played: 42
                        wins: 25
                        losses: 17
                        winrate: 59.52
        "400":
          description: Invalid input / validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidNickname:
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Invalid input"
                      details:
                        - field: "nickname"
                          message: "Nickname must be 3-30 characters and use [A-Z a-z 0-9 _]"
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (nickname already taken)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                nicknameTaken:
                  value:
                    error:
                      code: "NICKNAME_TAKEN"
                      message: "Nickname already in use"
                      field: "nickname"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/avatar:
    post:
      tags: [Users]
      summary: Upload avatar
      description: |
        Uploads an avatar image and returns the new avatarUrl.
        Used by /profile in edit mode when the user selects an image file.
      operationId: uploadAvatar
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AvatarUploadRequest"
      responses:
        "200":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadResponse"
              examples:
                uploaded:
                  value:
                    avatarUrl: "https://cdn.example.com/avatars/u_123.webp"
        "400":
          description: Invalid file (type/size) or bad input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                fileTooLarge:
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Invalid input"
                      details:
                        - field: "file"
                          message: "Avatar file must be <= 2MB"
                badType:
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Invalid input"
                      details:
                        - field: "file"
                          message: "Only PNG, JPG, or WebP are allowed"
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/password:
    post:
      tags: [Users]
      summary: Change password
      description: |
        Changes the authenticated user's password.
        Requires currentPassword + newPassword. (confirm is done client-side)
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            examples:
              change:
                value:
                  currentPassword: "old-secret"
                  newPassword: "new-secret-123"
      responses:
        "204":
          description: Password changed successfully (no content)
        "400":
          description: Invalid input / validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                weakPassword:
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Invalid input"
                      details:
                        - field: "newPassword"
                          message: "Password must be at least 8 characters"
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                wrongCurrent:
                  value:
                    error:
                      code: "CURRENT_PASSWORD_INCORRECT"
                      message: "Current password is incorrect"
                      field: "currentPassword"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leaderboard:
    get:
      tags: [Leaderboard]
      summary: Get leaderboard
      description: |
        Returns a paginated leaderboard of registered users with basic stats and presence.
        Used by the /leaderboard screen to render the table.
      operationId: getLeaderboard
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          description: Page number (1-based).
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          description: Items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sortBy
          required: false
          description: Sorting field.
          schema:
            type: string
            enum: [rank, winrate, wins, played, nickname]
            default: rank
        - in: query
          name: sortOrder
          required: false
          description: Sorting order.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - in: query
          name: q
          required: false
          description: Optional search filter for nickname.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Leaderboard page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
              examples:
                page1:
                  value:
                    page: 1
                    pageSize: 25
                    total: 2
                    items:
                      - id: "u_123"
                        nickname: "alice"
                        status: "online"
                        played: 42
                        wins: 25
                        losses: 17
                        winrate: 59.52
                        rank: 1
                        friendship:
                          state: "none"
                          canAdd: true
                      - id: "u_456"
                        nickname: "bob"
                        status: "offline"
                        played: 10
                        wins: 2
                        losses: 8
                        winrate: 20.0
                        rank: 2
                        friendship:
                          state: "friends"
                          canAdd: false
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friends/requests:
    post:
      tags: [Friends]
      summary: Send friend request
      description: |
        Creates a friend request to the target user. Used by the "Add" column in /leaderboard.
      operationId: sendFriendRequest
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestCreate"
            examples:
              addFriend:
                value:
                  toUserId: "u_456"
      responses:
        "201":
          description: Friend request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestResponse"
              examples:
                created:
                  value:
                    request:
                      id: "fr_001"
                      toUserId: "u_456"
                      status: "pending"
                      createdAt: "2026-01-12T11:00:00Z"
        "400":
          description: Invalid input / validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userNotFound:
                  value:
                    error:
                      code: "USER_NOT_FOUND"
                      message: "User not found"
        "409":
          description: Conflict (already friends / request exists / cannot add self)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyFriends:
                  value:
                    error:
                      code: "ALREADY_FRIENDS"
                      message: "You are already friends"
                requestExists:
                  value:
                    error:
                      code: "REQUEST_ALREADY_EXISTS"
                      message: "Friend request already exists"
                cannotAddSelf:
                  value:
                    error:
                      code: "CANNOT_ADD_SELF"
                      message: "You cannot add yourself"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get public profile
      description: |
        Returns public profile data for a user selected from the leaderboard.
        Includes avatar, nickname, bio, winPhrase and stats (played/wins/losses/winrate/rank).
        Presence (online/offline) can be returned here or updated via WebSocket.
      operationId: getPublicProfile
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          example: "u_456"
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfileResponse"
              examples:
                profile:
                  value:
                    user:
                      id: "u_456"
                      nickname: "bob"
                      status: "online"
                      avatarUrl: "https://cdn.example.com/avatars/u_456.webp"
                      bio: "Pong lover"
                      winPhrase: "GG EZ"
                      stats:
                        played: 42
                        wins: 25
                        losses: 17
                        winrate: 59.52
                        rank: 12
        "401":
          description: Not authenticated / invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error:
                      code: "USER_NOT_FOUND"
                      message: "User not found"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

               

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignupRequest:
      type: object
      additionalProperties: false
      required: [username, email, password, confirmPassword]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          description: |
            Public username. Suggested allowed chars: letters, numbers, underscore.
          pattern: "^[a-zA-Z0-9_]+$"
          example: "player1"
        email:
          type: string
          format: email
          example: "player1@email.com"
        password:
          type: string
          minLength: 8
          description: |
            Password rules should match backend validation. Minimum 8 chars recommended.
          example: "secret-password"
        confirmPassword:
          type: string
          minLength: 8
          example: "secret-password"
        acceptTerms:
          type: boolean
          default: false
          description: Optional. If your product requires terms acceptance, enforce it server-side.
        autoLogin:
          type: boolean
          default: true
          description: |
            If true, server returns a token so client can redirect to /app authenticated.
            If false, server returns only the user and client redirects to /signin.

    SignupResponseAutoLogin:
      type: object
      additionalProperties: false
      required: [token, user]
      properties:
        token:
          type: string
          description: Bearer token to be used in Authorization header.
          example: "eyJhbGciOi..."
        user:
          $ref: "#/components/schemas/User"

    SignupResponseNoAutoLogin:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Invalid input"
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field:
                    type: string
                    example: "email"
                  message:
                    type: string
                    example: "Email must be a valid email address"
    Room:
      type: object
      additionalProperties: false
      required: [id, name, status, capacity, playersCount, host, createdAt]
      properties:
        id:
          type: string
          example: "r_001"
        name:
          type: string
          example: "Room Alpha"
        status:
          type: string
          enum: [open, full, starting, closed]
          example: "open"
        capacity:
          type: integer
          minimum: 2
          maximum: 2
          example: 2
        playersCount:
          type: integer
          minimum: 0
          maximum: 2
          example: 1
        host:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-12T10:00:00Z"

    RoomListResponse:
      type: object
      additionalProperties: false
      required: [rooms]
      properties:
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/Room"

    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          example: "My room"

    CreateRoomResponse:
      type: object
      additionalProperties: false
      required: [room]
      properties:
        room:
          $ref: "#/components/schemas/Room"

    JoinRoomResponse:
      type: object
      additionalProperties: false
      required: [roomId, lobbyUrl]
      properties:
        roomId:
          type: string
          example: "r_001"
        lobbyUrl:
          type: string
          description: Frontend route to navigate after joining.
          example: "/rooms/r_001"

    PublicUser:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          type: string
          example: "u_123"
        username:
          type: string
          example: "alice"
        avatarUrl:
          type: string
          nullable: true
          example: null

    RoomLobbyState:
      type: object
      additionalProperties: false
      required: [id, status, capacity, playersCount, host, hostReady, guestReady, createdAt]
      properties:
        id:
          type: string
          example: "r_001"
        name:
          type: string
          nullable: true
          example: "Room Alpha"
        code:
          type: string
          nullable: true
          description: Optional short code/slug shown in UI.
          example: "A1B2C3"
        status:
          type: string
          enum: [open, full, starting, closed]
          example: "open"
        capacity:
          type: integer
          minimum: 2
          maximum: 2
          example: 2
        playersCount:
          type: integer
          minimum: 0
          maximum: 2
          example: 1
        host:
          $ref: "#/components/schemas/PublicUser"
        guest:
          allOf:
            - $ref: "#/components/schemas/PublicUser"
          nullable: true
        hostReady:
          type: boolean
          example: false
        guestReady:
          type: boolean
          example: false
        countdown:
          type: object
          nullable: true
          additionalProperties: false
          required: [from, startedAt]
          properties:
            from:
              type: integer
              minimum: 1
              maximum: 10
              example: 3
            startedAt:
              type: string
              format: date-time
              example: "2026-01-12T10:10:00Z"
        gameId:
          type: string
          nullable: true
          description: Present when status becomes `starting` (or when game is created).
          example: "g_789"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-12T10:00:00Z"

    RoomStateResponse:
      type: object
      additionalProperties: false
      required: [room]
      properties:
        room:
          $ref: "#/components/schemas/RoomLobbyState"

    ReadyRequest:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready:
          type: boolean
          example: true

    MeResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/MeUser"

    MeUser:
      type: object
      additionalProperties: false
      required: [id, nickname, bio, avatarUrl, winPhrase, stats]
      properties:
        id:
          type: string
          example: "u_123"
        nickname:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z0-9_]+$"
          example: "alice"
        bio:
          type: string
          maxLength: 280
          example: "Pong lover"
        avatarUrl:
          type: string
          nullable: true
          example: "https://cdn.example.com/avatars/u_123.webp"
        winPhrase:
          type: string
          maxLength: 80
          example: "GG EZ"
        stats:
          $ref: "#/components/schemas/UserStatsSummary"

    UserStatsSummary:
      type: object
      additionalProperties: false
      required: [played, wins, losses, winrate]
      properties:
        played:
          type: integer
          minimum: 0
          example: 42
        wins:
          type: integer
          minimum: 0
          example: 25
        losses:
          type: integer
          minimum: 0
          example: 17
        winrate:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 59.52

    UpdateMeRequest:
      type: object
      additionalProperties: false
      description: |
        Partial update. Only send the fields that changed.
        (The server should ignore null/undefined fields.)
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z0-9_]+$"
          example: "alice2"
        bio:
          type: string
          maxLength: 280
          example: "New bio"
        winPhrase:
          type: string
          maxLength: 80
          example: "You never stood a chance"
        avatarUrl:
          type: string
          nullable: true
          example: "https://cdn.example.com/avatars/u_123.webp"

    AvatarUploadRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PNG/JPG/WebP, max 2MB (enforce server-side).

    AvatarUploadResponse:
      type: object
      additionalProperties: false
      required: [avatarUrl]
      properties:
        avatarUrl:
          type: string
          example: "https://cdn.example.com/avatars/u_123.webp"

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          example: "old-secret"
        newPassword:
          type: string
          minLength: 8
          example: "new-secret-123"

    LeaderboardItem:
      type: object
      additionalProperties: false
      required: [id, nickname, status, played, wins, losses, winrate, rank, friendship]
      properties:
        id:
          type: string
          example: "u_123"
        nickname:
          type: string
          example: "alice"
        status:
          type: string
          enum: [online, offline]
          example: "online"
        played:
          type: integer
          minimum: 0
          example: 42
        wins:
          type: integer
          minimum: 0
          example: 25
        losses:
          type: integer
          minimum: 0
          example: 17
        winrate:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 59.52
        rank:
          type: integer
          minimum: 1
          example: 1
        friendship:
          $ref: "#/components/schemas/FriendshipState"

    LeaderboardResponse:
      type: object
      additionalProperties: false
      required: [page, pageSize, total, items]
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          example: 25
        total:
          type: integer
          minimum: 0
          example: 250
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardItem"

    FriendshipState:
      type: object
      additionalProperties: false
      required: [state, canAdd]
      properties:
        state:
          type: string
          description: Relationship state relative to the authenticated user.
          enum: [none, requested, pending, friends, blocked]
          example: "none"
        canAdd:
          type: boolean
          description: True if the "Add" CTA should be enabled.
          example: true

    FriendRequestCreate:
      type: object
      additionalProperties: false
      required: [toUserId]
      properties:
        toUserId:
          type: string
          example: "u_456"

    FriendRequest:
      type: object
      additionalProperties: false
      required: [id, toUserId, status, createdAt]
      properties:
        id:
          type: string
          example: "fr_001"
        toUserId:
          type: string
          example: "u_456"
        status:
          type: string
          enum: [pending, accepted, rejected, canceled]
          example: "pending"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-12T11:00:00Z"

    FriendRequestResponse:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/FriendRequest"

    PublicProfileResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/PublicProfileUser"

    PublicProfileUser:
      type: object
      additionalProperties: false
      required: [id, nickname, avatarUrl, bio, winPhrase, stats]
      properties:
        id:
          type: string
          example: "u_456"
        nickname:
          type: string
          example: "bob"
        status:
          type: string
          nullable: true
          description: |
            Optional if presence is delivered purely via WebSocket.
            If provided here, values are online/offline.
          enum: [online, offline]
          example: "online"
        avatarUrl:
          type: string
          nullable: true
          example: "https://cdn.example.com/avatars/u_456.webp"
        bio:
          type: string
          nullable: true
          maxLength: 280
          example: "Pong lover"
        winPhrase:
          type: string
          nullable: true
          maxLength: 80
          example: "GG EZ"
        stats:
          $ref: "#/components/schemas/PublicProfileStats"

    PublicProfileStats:
      type: object
      additionalProperties: false
      required: [played, wins, losses, winrate, rank]
      properties:
        played:
          type: integer
          minimum: 0
          example: 42
        wins:
          type: integer
          minimum: 0
          example: 25
        losses:
          type: integer
          minimum: 0
          example: 17
        winrate:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 59.52
        rank:
          type: integer
          minimum: 1
          example: 12
