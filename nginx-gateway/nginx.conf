events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ────────────────────────────────────────
    # UPSTREAMS - Define los backend services
    # ────────────────────────────────────────
    upstream auth_backend {
        server auth-service:8081;
    }

    upstream game_backend {
        server game-service:2567;
    }

    upstream profile_backend {
        server profile-service:5000;
    }

    upstream statistics_backend {
        server statistics-service:6000;
    }

    upstream frontend_app {
        server frontend:3000;
    }

    upstream game_frontend_app {
        server game-frontend:80;
    }

    # ────────────────────────────────────────
    # SERVIDOR PRINCIPAL (HTTPS)
    # ────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;  # Catch-all - responds to any hostname/IP

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # ────────────────────────────────────────
        # API ROUTES (deben ir ANTES del location /)
        # ────────────────────────────────────────
        
        # Auth API
        location /api/auth/ {
            proxy_pass http://auth_backend/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # add_header 'Access-Control-Allow-Origin' 'https://localhost:8443' always;
            # add_header 'Access-Control-Allow-Credentials' 'true' always;
            # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            # add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            if ($request_method = 'OPTIONS') { return 204; }
        }

		# INTERNAL auth verify
		location = /_internal/auth_verify {
			internal;

			proxy_pass http://auth_backend/auth/verify;

			proxy_pass_request_body off;
			proxy_set_header Content-Length "";

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}


        # Game API / Matchmaking (Colyseus)
        location /api/game/ {
            rewrite ^/api/game/(.*)$ /$1 break;
            proxy_pass http://game_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # Global chat WebSocket
        location /api/chat/ws {
            auth_request /_internal/auth_verify;
            proxy_pass http://profile_backend/chat/ws;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Profile API
        location /api/profile/ {
#			rewrite ^/api/profile/(.*)$ /$1 break;
			auth_request /_internal/auth_verify;
            proxy_pass http://profile_backend/profile/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

			# add_header 'Access-Control-Allow-Origin' 'https://localhost:8443' always;
			# add_header 'Access-Control-Allow-Credentials' 'true' always;
			# add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
			# add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

			if ($request_method = 'OPTIONS') { return 204; }
        }

		location /uploads/avatars/ {
			alias /app/uploads/avatars/;
#			expires 30d;
			add_header Cache-Control "public, no-transform";

			location ~ \.(php|js|sh)$ {
				deny all;
			}

			try_files $uri /static/default-avatar.webp;
		}

		location /static/ {
			alias /app/static/;
			add_header Cache-Control "public, max-age=86400";

			location ~ \.(php|js|sh)$ {
				deny all;
			}
		}

        # Statistics API
        location /api/statistics/ {
			auth_request /_internal/auth_verify;
            proxy_pass http://statistics_backend/statistics/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket para Colyseus game server
        location /ws/ {
            rewrite ^/ws/(.*)$ /$1 break;
            proxy_pass http://game_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Frontend propio del game-engine (Vite build)
        location /game-engine/ {
            proxy_pass http://game_frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Allow iframe embedding from same origin
            add_header X-Frame-Options "SAMEORIGIN" always;
            # Ensure WebGL and canvas work properly in iframes
            add_header Feature-Policy "accelerometer 'self'; camera 'none'; geolocation 'none'; gyroscope 'self'; magnetometer 'self'; microphone 'none'; payment 'none'; usb 'none'" always;
        }

        # Icons for game-engine
        location /icons/ {
            proxy_pass http://game_frontend_app;
            proxy_set_header Host $host;
        }

        # Alias legacy: redirige al path canónico del game frontend
        location = /game-mode {
            return 301 /game-engine/;
        }

        location /game-mode/ {
            return 301 /game-engine/;
        }

        # ────────────────────────────────────────
        # FRONTEND - Next.js App (debe ir AL FINAL)
        # ────────────────────────────────────────
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ────────────────────────────────────────
    # SERVIDOR PARA MÉTRICAS (puerto 8080)
    # ────────────────────────────────────────
    server {
        listen 8080;

        location /nginx_status {
            stub_status;
            access_log off;
            
            # Solo permite acceso desde redes internas
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Redes Docker
            deny all;
        }
    }

    # ────────────────────────────────────────
    # OPCIONAL: Redirección HTTP -> HTTPS
    # ────────────────────────────────────────
    server {
        listen 80;
        server_name _;  # Catch-all - responds to any hostname/IP
        return 301 https://$host$request_uri;
    }
}
