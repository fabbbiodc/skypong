route:
  receiver: "default"
  group_by: ["alertname", "job"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: "default"
    # For demo, the simplest: use webhook to a mock service or just log.
    # Here we leave it without external integrations.
    # You can add email/slack/discord later.
