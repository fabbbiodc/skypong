global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 3s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          service: monitoring

  - job_name: nginx_exporter
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: gateway

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: containers

  - job_name: profile_service
    metrics_path: /metrics
    static_configs:
      - targets: ["profile-service:5000"]
        labels:
          service: profile

  - job_name: statistics_service
    metrics_path: /metrics
    static_configs:
      - targets: ["statistics-service:6000"]
        labels:
          service: statistics
