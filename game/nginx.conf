server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 1. Redirect /game-engine (missing trailing slash) → /game-engine/
    location = /game-engine {
        return 301 /game-engine/;
    }
    # 2. Serve SPA at /game-engine/
    location /game-engine/ {
        rewrite ^/game-engine/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }
    # 3. Redirect bare root (/) → /game-engine/
    location = / {
        return 302 /game-engine/;
    }
    # (Optionally, remove or comment out any existing 'location / { ... }' block to prevent root-level serving)
}